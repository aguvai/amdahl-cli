version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # One weekly PR for all minor and patch updates (AMD-1156). Majors come
      # one by one. Version updates only; security updates stay individual.
      all-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      all-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
