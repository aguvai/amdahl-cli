name: Publish

# Publishes @amdahl/cli (the `amdahl` command) to npm, then `amdahl`, its
# short name (packages/amdahl: `npx amdahl` runs @amdahl/cli at the same
# version). `amdahl` is published only when the repository variable
# NPM_PUBLISH_AMDAHL is `true`: trusted publishing can be set up for a package
# only once it exists, so its first version is published by hand (README,
# "Releasing").
#
# - Push a tag `cli-v<version>` (for example `cli-v0.2.0`) to publish that
#   version. The tag must equal the version in package.json and src/version.ts.
# - Or run it by hand (Actions, Publish, Run workflow). A manual run is a dry
#   run unless you clear `dry_run`: it builds, tests, packs and runs
#   `npm publish --dry-run`, and sends nothing to the registry.
#
# The `verify` job builds, tests and smoke-tests the tarball. The `publish` job
# publishes that exact tarball, so what npm serves is byte for byte what ran
# `--help` and `--version` here. Only `publish` can mint an OIDC token, and it
# runs in the `npm` environment.
#
# Authentication is npm trusted publishing (GitHub OIDC) only, which also
# signs provenance. There is no token fallback.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must equal package.json. Empty = use package.json.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: build, test, pack and npm publish --dry-run, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
      tgz_name: ${{ steps.pack.outputs.tgz_name }}
      short_tgz_name: ${{ steps.pack.outputs.short_tgz_name }}
    env:
      # A tag push always publishes. A manual run publishes only when the
      # box is cleared.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Resolve and check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          src_version=$(sed -n "s/^export const VERSION = '\(.*\)'$/\1/p" src/version.ts)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            want="${REF_NAME#cli-v}"
          else
            want="${INPUT_VERSION:-$pkg_version}"
          fi
          if [ "$want" != "$pkg_version" ] || [ "$want" != "$src_version" ]; then
            echo "::error::Version mismatch: wanted $want, package.json has $pkg_version, src/version.ts has $src_version. Bump both in a PR first."
            exit 1
          fi
          if npm view "@amdahl/cli@$want" version >/dev/null 2>&1; then
            echo "::error::@amdahl/cli@$want is already on npm. Bump the version."
            exit 1
          fi
          # A prerelease (0.2.0-rc.1) goes to the `next` dist-tag so `npx
          # @amdahl/cli` keeps resolving to the last stable release.
          if [[ "$want" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @amdahl/cli@$want to dist-tag $dist_tag (dry run: $DRY_RUN)"

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/cli-pack"
          mkdir -p "$dest"
          pnpm pack --pack-destination "$dest"
          name="amdahl-cli-${{ steps.version.outputs.version }}.tgz"
          test -f "$dest/$name"
          tar -tzf "$dest/$name"
          echo "tgz=$dest/$name" >> "$GITHUB_OUTPUT"
          echo "tgz_name=$name" >> "$GITHUB_OUTPUT"
          (cd packages/amdahl && npm pack --pack-destination "$dest")
          short="amdahl-${{ steps.version.outputs.version }}.tgz"
          test -f "$dest/$short"
          tar -tzf "$dest/$short"
          echo "short_tgz_name=$short" >> "$GITHUB_OUTPUT"

      # Run the tarball from an empty directory with no project around it,
      # the way `npx @amdahl/cli` runs on a user's machine.
      - name: Smoke-test the tarball
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          WANT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp "$TGZ" "$work/"
          cd "$work"
          npx --yes "./$(basename "$TGZ")" --help
          got=$(npx --yes "./$(basename "$TGZ")" --version)
          if [ "$got" != "$WANT" ]; then
            echo "::error::--version printed '$got', expected '$WANT'"
            exit 1
          fi
          node "$GITHUB_WORKSPACE/scripts/smoke-pack.mjs"

      - name: Publish dry run
        if: env.DRY_RUN == 'true'
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          SHORT_TGZ: ${{ runner.temp }}/cli-pack/${{ steps.pack.outputs.short_tgz_name }}
        run: |
          set -euo pipefail
          npm publish "$TGZ" --access public --tag "$DIST_TAG" --dry-run
          npm publish "$SHORT_TGZ" --access public --tag "$DIST_TAG" --dry-run

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: |
            ${{ steps.pack.outputs.tgz }}
            ${{ runner.temp }}/cli-pack/${{ steps.pack.outputs.short_tgz_name }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    # Skipped on a dry run, so a dry run never enters the `npm` environment.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" is older than 11.5.1"); process.exit(1) }' "$(npm --version)"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
          path: ${{ runner.temp }}/cli-pack

      - name: Publish
        shell: bash
        env:
          TGZ: ${{ runner.temp }}/cli-pack/${{ needs.verify.outputs.tgz_name }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$TGZ"
          # setup-node writes an empty _authToken line, which stops npm from trying OIDC: https://github.com/actions/setup-node/issues/1551
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          # A re-run after the amdahl step failed: this one is already done.
          if npm view "@amdahl/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@amdahl/cli@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish "$TGZ" --access public --provenance --tag "$DIST_TAG"

      # After @amdahl/cli, which it depends on at this exact version.
      - name: Publish the amdahl short name
        if: ${{ vars.NPM_PUBLISH_AMDAHL == 'true' }}
        shell: bash
        env:
          TGZ: ${{ runner.temp }}/cli-pack/${{ needs.verify.outputs.short_tgz_name }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$TGZ"
          if npm view "amdahl@$VERSION" version >/dev/null 2>&1; then
            echo "amdahl@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          npm publish "$TGZ" --access public --provenance --tag "$DIST_TAG"
